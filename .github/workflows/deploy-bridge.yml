name: Deploy MT5 bridge (Windows EC2)

# Push to main touching the bridge → test → SSM Run Command on the Windows host
# (no RDP / open ports needed; GitHub authenticates to AWS with OIDC).
on:
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'scripts/windows/**'
  workflow_dispatch:

concurrency:
  group: deploy-bridge
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AWS
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      INSTANCE_ID: ${{ secrets.WINDOWS_INSTANCE_ID }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            echo "WINDOWS_INSTANCE_ID secret not set — skipping deploy"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.skip != 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.ps1 via SSM
        if: steps.check.outputs.skip != 'true'
        run: |
          cat > params.json <<EOF
          {"commands":["& 'C:/fundednext-bot/scripts/windows/deploy.ps1' -Branch '${GITHUB_REF_NAME}' -Region '${AWS_REGION}'"],"executionTimeout":["900"]}
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunPowerShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{out:StandardOutputContent,err:StandardErrorContent}' --output text
          [ "$STATUS" = "Success" ]
