services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fundednext-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
